<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lommeregner</title>
</head>
<body>
    <form method="POST">
        <input type="text" name="calc" placeholder="Skriv udtryk (fx {{ 7*7 }})" required>
        <button type="submit">Beregn</button>

        <p>Resultat: {{ output | safe }}</p>
    {% endif %}
</body>
</html>
