<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CalculatorPRO™</title>
</head>
<body>
    <form method="POST">
        <input type="text" name="calc" placeholder="Write expression (e.g. 7*7)" required>
        <button type="submit">Calculate</button>
    </form>
    
    {% if output %}
        <p>Result: {{ output | safe }}</p>
    {% endif %}
</body>
</html>
